<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a101e"><meta name="robots" content="noindex">
<title>Quét mã QR căn cước</title>
<style>
html,body{margin:0;background:#0a101e;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hidden{display:none!important}
.btn{font-family:inherit;font-size:15px;border-radius:8px;border:1px solid #1f4580;background:#1f4580;color:#fff;font-weight:600;padding:10px 14px;cursor:pointer}
.btn.ok{background:#1e7b45;border-color:#1e7b45}.btn.sm{font-size:13px;padding:7px 10px}
#home{padding:24px 16px;text-align:center;line-height:1.5}
/* Quét QR */
#qrOv{position:fixed;inset:0;background:rgba(10,16,30,.97);z-index:90;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
#qrOv .qrbox{width:min(520px,100%);color:#fff}
#qrOv .qrhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:15px}
#qrOv .qrhead .x{margin-left:auto;background:none;border:0;color:#fff;font-size:32px;line-height:1;cursor:pointer;padding:0 6px}
#qrOv .qrcam{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:12px;overflow:hidden}
#qrOv video{width:100%;height:100%;object-fit:cover;display:block}
#qrOv .qrframe{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);transition:box-shadow .2s}
#qrOv .qrframe i{position:absolute;width:26%;height:26%;border:4px solid #facc15;transition:border-color .2s}
#qrOv .qrframe .c1{left:-3px;top:-3px;border-right:0;border-bottom:0;border-top-left-radius:12px}
#qrOv .qrframe .c2{right:-3px;top:-3px;border-left:0;border-bottom:0;border-top-right-radius:12px}
#qrOv .qrframe .c3{left:-3px;bottom:-3px;border-right:0;border-top:0;border-bottom-left-radius:12px}
#qrOv .qrframe .c4{right:-3px;bottom:-3px;border-left:0;border-top:0;border-bottom-right-radius:12px}
#qrOv .qrline{position:absolute;left:6%;right:6%;top:8%;height:2px;background:#facc15;box-shadow:0 0 8px #facc15;animation:qrscan 1.8s ease-in-out infinite alternate}
@keyframes qrscan{to{top:92%}}
#qrOv .qrframe.okk i{border-color:#22c55e}#qrOv .qrframe.okk .qrline{display:none}
#qrOv .qrframe.warn i{border-color:#f87171}
#qrOv .qrframe.shot i{border-color:#fff}
#qrOv .qrsnap{position:absolute;inset:0;width:100%;height:100%;display:none}
#qrOv .qrtip{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:13.5px;font-weight:600;text-shadow:0 1px 3px #000;pointer-events:none}
#qrOv .qrmsg{margin:10px 0;font-size:14px;line-height:1.45}
#qrOv .qrbtns{display:flex;gap:8px;flex-wrap:wrap}
#qrOv .qrbtns .btn{flex:1 1 45%;text-align:center;display:inline-block;cursor:pointer;padding:12px}
#qrOv .qrpaste{margin-top:10px;font-size:13px}
#qrOv .qrpaste summary{color:#cbd5e1;font-weight:400}
#qrOv textarea{width:100%;margin:8px 0;font-size:14px}
#qrOv label.btn{font-family:inherit;font-size:15px;border-radius:8px;border:1px solid #1e7b45;background:#1e7b45;color:#fff;font-weight:600}
#qrOv label.btn.sec{background:#fff;color:#1f4580;border-color:#fff}
#qrOv .qrpaste .btn{background:#1f4580;color:#fff;border:0}
#qrOv .qreng{margin-top:8px;font-size:11.5px;color:#94a3b8}
#qrOv .qrpimg{position:relative;width:100%;background:#000;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#qrOv .qrpimg img{display:block;width:100%;max-height:none;pointer-events:auto;-webkit-user-drag:none}
#qrOv .qrsq{position:absolute;border:3px solid #facc15;border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);touch-action:none;cursor:move}
#qrOv .qrsq.rd{border-color:#fff}#qrOv .qrsq.okk{border-color:#22c55e}
#qrOv .qrrs{position:absolute;right:-14px;bottom:-14px;width:28px;height:28px;border-radius:50%;background:#facc15;border:3px solid #fff;touch-action:none;cursor:nwse-resize}

#qrOv{background:#0a101e}
</style></head><body>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function digits(s){return String(s||'').replace(/\D/g,'');}
function fixCC(s){return digits(s);}
function normGT(s){s=String(s||'').trim().toLowerCase();return /^n[ữu]/.test(s)?'Nữ':(/^nam/.test(s)?'Nam':s);}
/* ===== Quét mã QR trên thẻ Căn cước / CCCD ===== */
var QRS={stream:null,raf:0,cb:null,det:null,busy:false};
function parseCCCD(txt){
  txt=String(txt||'').trim();
  var p=txt.split('|').map(function(s){return s.trim();});
  var d8=function(s){s=digits(s);return s.length===8?s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4):s;};
  if(p.length>=6&&/^\d{9,12}$/.test(p[0])){
    return {cccd:fixCC(p[0]),cmnd:p[1]||'',hoTen:(p[2]||'').toUpperCase(),ngaySinh:d8(p[3]),gioiTinh:normGT(p[4]),diaChi:p[5]||'',ngayCap:d8(p[6]||'')};
  }
  var d=digits(txt);
  if(d.length===12&&d===txt.replace(/\s/g,''))return {cccd:d};
  return null;
}
function qrStop(){
  cancelAnimationFrame(QRS.raf);QRS.raf=0;clearTimeout(QRS.snapT);QRS.done=false;
  if(QRS.stream){QRS.stream.getTracks().forEach(function(t){t.stop();});QRS.stream=null;}
  var o=document.getElementById('qrOv');if(o)o.remove();
}
function qrDone(txt){
  var info=parseCCCD(txt);
  if(!info){
    var m=document.getElementById('qrMsg');if(m)m.innerHTML='<span style="color:#f87171">Mã QR này không phải mã thẻ Căn cước/CCCD.</span> Đưa đúng mã QR ở góc trên mặt trước thẻ vào khung.';
    QRS.bad=String(txt);return false;
  }
  try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}
  var cb=QRS.cb;qrStop();cb(info);return true;
}
/* Bộ giải mã: ZBar (WebAssembly) là chính; BarcodeDetector / jsQR dự phòng */
var ZB={sc:null,ok:null};
async function zbarInit(){
  if(ZB.ok!==null)return ZB.ok;
  try{
    if(!window.zbarWasm)throw new Error('no zbar');
    var sc=await zbarWasm.getDefaultScanner();
    try{sc.setConfig(zbarWasm.ZBarSymbolType.ZBAR_NONE,zbarWasm.ZBarConfigType.ZBAR_CFG_ENABLE,0);
        sc.setConfig(zbarWasm.ZBarSymbolType.ZBAR_QRCODE,zbarWasm.ZBarConfigType.ZBAR_CFG_ENABLE,1);}catch(e){}
    ZB.sc=sc;ZB.ok=true;
  }catch(e){ZB.ok=false;}
  return ZB.ok;
}
async function zbarRead(img){
  if(!(await zbarInit()))return null;
  try{
    var syms=await zbarWasm.scanImageData(img,ZB.sc);
    for(var i=0;i<syms.length;i++){if(syms[i].type===64||/QR/.test(syms[i].typeName))return syms[i].decode('utf-8');}
  }catch(e){}
  return null;
}
async function decodeCanvas(c,ctx,fast){
  var img=ctx.getImageData(0,0,c.width,c.height);
  var t=await zbarRead(img);if(t)return t;
  if(fast&&ZB.ok)return null; /* dò nhanh nhiều vùng: chỉ dùng ZBar */
  if(QRS.det){try{var b=await QRS.det.detect(c);if(b&&b[0])return b[0].rawValue;}catch(e){}}
  var r=window.jsQR?jsQR(img.data,c.width,c.height,{inversionAttempts:'attemptBoth'}):null;
  return r&&r.data?r.data:null;
}
function cropDecode(img,x,y,side,out,fast){
  var c=document.createElement('canvas');c.width=c.height=Math.round(Math.min(out,Math.max(side,out*0.6)));
  var ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,x,y,side,side,0,0,c.width,c.height);
  return decodeCanvas(c,ctx,fast);
}
async function qrDecodeImage(file){
  var msg=document.getElementById('qrMsg');if(msg)msg.textContent='Đang đọc ảnh…';
  var pk=document.getElementById('qrPick');if(pk)pk.remove();
  var url=URL.createObjectURL(file);
  try{
    var img=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=url;});
    var W=img.naturalWidth,H=img.naturalHeight;
    /* 1) đọc cả ảnh ở nhiều kích thước */
    var sizes=[1200,1800,800,2600];
    for(var k=0;k<sizes.length;k++){
      var s=Math.min(1,sizes[k]/Math.max(W,H)),c=document.createElement('canvas');
      c.width=Math.round(W*s);c.height=Math.round(H*s);
      var ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);
      var t=await decodeCanvas(c,ctx);if(t){qrDone(t);return;}
    }
    /* 2) tự dò từng vùng vuông trên ảnh (mã QR nhỏ so với ảnh) */
    var m=Math.min(W,H),fr=[0.6,0.42,0.3,0.22],tried=0;
    for(var f=0;f<fr.length;f++){
      var side=m*fr[f],step=side/2;
      for(var yy=0;yy+side<=H+1;yy+=step)for(var xx=0;xx+side<=W+1;xx+=step){
        if(!document.getElementById('qrOv'))return;
        if(msg&&(++tried%6===0))msg.textContent='Đang dò mã QR trên ảnh… ('+tried+')';
        var t3=await cropDecode(img,Math.min(xx,W-side),Math.min(yy,H-side),side,720,true);
        if(t3){qrDone(t3);return;}
      }
    }
    /* 3) không tự đọc được -> cho người dùng kéo ô vuông vào mã QR */
    qrPicker(img,url);url=null;
  }catch(e){if(msg)msg.textContent='Lỗi đọc ảnh: '+e.message;}
  finally{if(url)URL.revokeObjectURL(url);}
}
function qrPicker(img,url){
  var msg=document.getElementById('qrMsg'),cam=document.getElementById('qrCam');if(cam)cam.style.display='none';
  var W=img.naturalWidth,H=img.naturalHeight;
  var box=document.createElement('div');box.id='qrPick';box.className='qrpick';
  box.innerHTML='<div class="qrpimg"><img alt=""><div class="qrsq"><b class="qrrs"></b></div></div>'+
    '<div class="qrbtns" style="margin-top:8px"><button class="btn ok" id="qrPickGo">🔍 Đọc mã trong ô vuông</button></div>';
  var head=document.querySelector('#qrOv .qrhead');head.parentNode.insertBefore(box,head.nextSibling);
  var im=box.querySelector('img'),wrap=box.querySelector('.qrpimg'),sq=box.querySelector('.qrsq'),rs=box.querySelector('.qrrs');
  im.src=url;
  if(msg)msg.innerHTML='<span style="color:#facc15">Chưa tự đọc được.</span> <b>Kéo ô vuông vàng vào đúng mã QR</b> (kéo góc dưới phải để đổi cỡ) – thả tay ra là phần mềm tự đọc. Ảnh mờ quá thì chụp lại gần hơn, đủ sáng.';
  var st={x:0,y:0,s:0};
  function lay(){
    var dw=wrap.clientWidth,dh=wrap.clientHeight;if(!dw||!dh)return;
    if(!st.s){st.s=Math.min(dw,dh)*0.45;st.x=(dw-st.s)/2;st.y=(dh-st.s)/2;}
    st.s=Math.max(40,Math.min(st.s,dw,dh));st.x=Math.max(0,Math.min(dw-st.s,st.x));st.y=Math.max(0,Math.min(dh-st.s,st.y));
    sq.style.left=st.x+'px';sq.style.top=st.y+'px';sq.style.width=sq.style.height=st.s+'px';

      var pads=[0.08,0,0.25],outs=[700,1000,500];
      for(var i=0;i<pads.length;i++){
        var sd=Math.min(W,H,side*(1+2*pads[i])),x0=Math.max(0,Math.min(W-sd,x+side/2-sd/2)),y0=Math.max(0,Math.min(H-sd,y+side/2-sd/2));
        var t=await cropDecode(img,x0,y0,sd,outs[i]);
        if(t){sq.classList.add('okk');if(qrDone(t)){URL.revokeObjectURL(url);}return;}
      }
      if(msg)msg.innerHTML='<span style="color:#f87171">Chưa đọc được trong ô vuông.</span> Đặt ô vuông bao trọn mã QR (cả 3 ô vuông nhỏ ở góc mã), hoặc chụp lại rõ hơn.';
    }finally{busy=false;sq.classList.remove('rd');}
  }
  document.getElementById('qrPickGo').onclick=read;
}
function openQR(cb,title){
  qrStop();QRS.cb=cb;QRS.bad=null;zbarInit().then(function(ok){var e=document.getElementById('qrEng');if(e)e.textContent='Bộ giải mã: '+(ok?'ZBar':'jsQR (dự phòng)');});
  try{if(!QRS.det&&'BarcodeDetector' in window)QRS.det=new BarcodeDetector({formats:['qr_code']});}catch(e){QRS.det=null;}
  var ov=document.createElement('div');ov.id='qrOv';
  ov.innerHTML='<div class="qrbox"><div class="qrhead"><b>'+esc(title||'Quét mã QR trên thẻ Căn cước / CCCD')+'</b><button class="x" id="qrX">×</button></div>'+
   '<div class="qrcam" id="qrCam"><video id="qrV" playsinline muted autoplay></video><canvas id="qrSnap" class="qrsnap"></canvas>'+
   '<div class="qrframe" id="qrFrame"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><b class="qrline"></b></div>'+
   '<div class="qrtip" id="qrTip">Đặt mã QR vào ô vuông</div></div>'+
   '<div id="qrMsg" class="qrmsg">Đang mở camera…</div>'+
   '<div class="qrbtns"><label class="btn ok">📸 Chụp ảnh mã QR<input type="file" accept="image/*" capture="environment" id="qrFile" class="hidden"></label>'+
   '<label class="btn sec">🖼 Chọn ảnh có sẵn<input type="file" accept="image/*" id="qrFile2" class="hidden"></label></div>'+
   '<details class="qrpaste"><summary>Dán nội dung QR (khi quét bằng Zalo/ứng dụng khác)</summary><textarea id="qrTxt" rows="3" placeholder="0790xxxxxxxx||HỌ TÊN|ddmmyyyy|Nam|Địa chỉ|ddmmyyyy"></textarea><button class="btn sm" id="qrTxtOk">Dùng nội dung này</button></details><div id="qrEng" class="qreng"></div></div>';
  document.body.appendChild(ov);
  document.getElementById('qrX').onclick=qrStop;
  ov.addEventListener('click',function(e){if(e.target===ov)qrStop();});
  ['qrFile','qrFile2'].forEach(function(id){document.getElementById(id).onchange=function(e){var f=e.target.files[0];if(f)qrDecodeImage(f);e.target.value='';};});
  document.getElementById('qrTxtOk').onclick=function(){qrDone(document.getElementById('qrTxt').value);};
  startCam();
}
/* Vùng ô vuông trên màn hình -> toạ độ trong khung hình camera (video dùng object-fit:cover) */
function frameRect(v,pad){
  var cam=document.getElementById('qrCam').getBoundingClientRect(),fr=document.getElementById('qrFrame').getBoundingClientRect();
  var vw=v.videoWidth,vh=v.videoHeight,sc=Math.max(cam.width/vw,cam.height/vh);
  var ox=(cam.width-vw*sc)/2,oy=(cam.height-vh*sc)/2;
  var side=fr.width/sc*(1+2*pad),cx=(fr.left-cam.left+fr.width/2-ox)/sc,cy=(fr.top-cam.top+fr.height/2-oy)/sc;
  side=Math.min(side,vw,vh);
  var x=Math.max(0,Math.min(vw-side,cx-side/2)),y=Math.max(0,Math.min(vh-side,cy-side/2));
  return {x:x,y:y,s:side,fx:x/vw,fy:y/vh,fs:side/vw,fsy:side/vh};
}
function qrState(kind,text){
  var f=document.getElementById('qrFrame'),t=document.getElementById('qrTip');
  if(f)f.className='qrframe'+(kind?' '+kind:'');if(t&&text)t.textContent=text;
}
/* Chụp tự động: đóng băng khung hình đã đọc được rồi chuyển sang điền thông tin */
function qrFreeze(src,r){
  var cv=document.getElementById('qrSnap'),cam=document.getElementById('qrCam');if(!cv||!cam)return;
  var w=cam.clientWidth,h=cam.clientHeight;cv.width=w;cv.height=h;
  var sw=src.videoWidth||src.width,sh=src.videoHeight||src.height,sc=Math.max(w/sw,h/sh);
  cv.getContext('2d').drawImage(src,(w-sw*sc)/2,(h-sh*sc)/2,sw*sc,sh*sc);cv.style.display='block';
}
async function qrFound(txt,src){
  if(QRS.done)return;
  if(!parseCCCD(txt)){if(QRS.bad!==txt)qrDone(txt);qrState('warn','Không phải mã QR căn cước');return;}
  QRS.done=true;qrFreeze(src);qrState('okk','✔ Đã chụp – đang đọc thông tin');
  var m=document.getElementById('qrMsg');if(m)m.innerHTML='<b style="color:#4ade80">✔ Đã tự động chụp và đọc được mã QR.</b> Đang điền thông tin…';
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  setTimeout(function(){qrDone(txt);},650);
}
async function startCam(){
  var v=document.getElementById('qrV'),msg=document.getElementById('qrMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail('Trình duyệt không cho mở camera trực tiếp.');return;}
  try{
    var st;
    try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
    catch(e1){if(e1&&e1.name==='NotAllowedError')throw e1;st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});}
    if(!document.getElementById('qrOv')){st.getTracks().forEach(function(t){t.stop();});return;}
    QRS.stream=st;v.srcObject=st;await v.play().catch(function(){});
    var tr=st.getVideoTracks()[0];
    /* lấy nét liên tục + phóng nhẹ để cầm thẻ cách xa vừa đủ, ảnh nét hơn */
    try{var cap=tr.getCapabilities?tr.getCapabilities():{},adv={};
      if(cap.focusMode&&cap.focusMode.indexOf('continuous')>=0)adv.focusMode='continuous';
      if(cap.zoom&&cap.zoom.max>=1.5)adv.zoom=Math.min(cap.zoom.max,1.6);
      if(Object.keys(adv).length)await tr.applyConstraints({advanced:[adv]});}catch(e){}
    var ic=null;try{if(window.ImageCapture)ic=new ImageCapture(tr);}catch(e){}
    msg.innerHTML='Đặt <b>mã QR ở góc trên mặt trước thẻ</b> vừa khít ô vuông và giữ yên – phần mềm <b>tự quét, tự chụp và tự đọc</b>.';
    var c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),n=0,t0=Date.now(),lastShot=Date.now();
    var tick=async function(){
      if(!QRS.stream||QRS.done)return;
      QRS.raf=requestAnimationFrame(tick);
      if(QRS.busy||v.readyState<2||!v.videoWidth)return;
      n++;if(n%2)return;
      QRS.busy=true;
      try{
        /* luân phiên: đúng ô vuông (thu nhỏ, nhanh) và ô vuông nới rộng ở độ phân giải gốc */
        var r=frameRect(v,(n/2)%2?0.12:0.35),out=(n/2)%2?Math.min(640,r.s):Math.min(1100,r.s);
        c.width=c.height=Math.round(out);ctx.drawImage(v,r.x,r.y,r.s,r.s,0,0,c.width,c.height);
        var t=await decodeCanvas(c,ctx);
        if(t){await qrFound(t,v);return;}
        if(Date.now()-t0>2500)qrState('',QRS.bad?'Không phải mã QR căn cước':'Đưa gần/xa một chút cho nét');
        /* tự chụp ảnh độ phân giải cao (Android) khi quét video chưa đọc được */
        if(ic&&Date.now()-lastShot>3000){
          lastShot=Date.now();qrState('shot','📸 Đang tự chụp…');
          try{
            var bm;try{bm=await createImageBitmap(await ic.takePhoto());}catch(e){bm=await ic.grabFrame();}
            if(QRS.done||!QRS.stream)return;
            var rr=frameRect(v,0.3),px=rr.fx*bm.width,py=rr.fy*bm.height,ps=Math.min(rr.fs*bm.width,rr.fsy*bm.height);
            var c2=document.createElement('canvas'),o2=Math.min(1400,ps);c2.width=c2.height=Math.round(o2);
            var x2=c2.getContext('2d',{willReadFrequently:true});x2.drawImage(bm,px,py,ps,ps,0,0,c2.width,c2.height);
            var t2=await decodeCanvas(c2,x2);
            if(t2){await qrFound(t2,v);return;}
          }catch(e){ic=null;}
          qrState('', 'Đặt mã QR vào ô vuông');
        }
      }catch(e){}finally{QRS.busy=false;}
    };
    tick();
    /* chạm vào khung hình để lấy nét lại */
    document.getElementById('qrCam').onclick=function(){try{tr.applyConstraints({advanced:[{focusMode:'single-shot'}]}).then(function(){return tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}).catch(function(){});}catch(e){}};
  }catch(e){camFail(e&&e.name==='NotAllowedError'?'Chưa được cấp quyền camera.':'Không mở được camera trực tiếp ('+(e&&e.name||e)+').');}
}
function camFail(why){
  var cam=document.querySelector('#qrOv .qrcam');if(cam)cam.style.display='none';
  var m=document.getElementById('qrMsg');if(m)m.innerHTML=esc(why)+'<br><b>Bấm “📸 Chụp ảnh mã QR”</b>, đưa camera <b>gần mã QR ở góc trên mặt trước thẻ</b> (mã chiếm khoảng nửa khung hình), chờ nét rồi chụp – phần mềm tự đọc. Nếu chưa đọc được, ảnh sẽ hiện kèm ô vuông để bạn kéo vào mã QR.';
}

/* ===== Phần riêng của trang quét: gửi kết quả về Apps Script của bạn ===== */
var P=new URLSearchParams(location.hash.slice(1)),TK=P.get('t')||'',EX=P.get('r')||'';
try{history.replaceState(null,'',location.pathname);}catch(e){} /* xoá link Apps Script khỏi thanh địa chỉ */
var VALID=/^[A-Za-z0-9]{20,64}$/.test(TK)&&/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(EX);
function homeMsg(h){document.getElementById('home').classList.remove('hidden');document.getElementById('homeMsg').innerHTML=h;}
qrStop=function(){
  cancelAnimationFrame(QRS.raf);QRS.raf=0;QRS.done=false;
  if(QRS.stream){QRS.stream.getTracks().forEach(function(t){t.stop();});QRS.stream=null;}
  var o=document.getElementById('qrOv');if(o)o.remove();
};
function closeOrBack(){try{window.close();}catch(e){}setTimeout(function(){homeMsg('Bạn có thể đóng tab này và quay lại app.<br><br><button class="btn" onclick="start()">Quét lại</button>');},300);}
qrDone=function(txt){
  var info=parseCCCD(txt);
  if(!info){var m=document.getElementById('qrMsg');if(m)m.innerHTML='<span style="color:#f87171">Mã QR này không phải mã thẻ Căn cước/CCCD.</span>';QRS.bad=String(txt);QRS.done=false;return false;}
  send(String(txt),info);return true;
};
async function send(txt,info){
  qrStop();
  homeMsg('✔ Đã đọc: <b>'+esc(info.hoTen||info.cccd)+'</b><br>Đang gửi về app…');
  var body=JSON.stringify({t:TK,q:txt}),ok=false;
  try{await fetch(EX,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});ok=true;}catch(e){}
  if(!ok){try{ok=navigator.sendBeacon(EX,new Blob([body],{type:'text/plain;charset=utf-8'}));}catch(e){}}
  if(!ok){homeMsg('<span style="color:#f87171">Không gửi được về app</span> – kiểm tra mạng rồi bấm thử lại.<br><br><button class="btn ok" id="again">Gửi lại</button>');document.getElementById('again').onclick=function(){send(txt,info);};return;}
  try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}
  homeMsg('✔ Đã gửi <b>'+esc(info.hoTen||info.cccd)+'</b> về app.<br>Đang quay lại app…');
  setTimeout(closeOrBack,900);
}
function start(){
  if(!VALID){homeMsg('Hãy mở trang này bằng nút <b>📷 Quét bằng camera</b> trong app Phúc tra hộ khẩu.');return;}
  document.getElementById('home').classList.add('hidden');
  openQR(function(){},'Quét mã QR trên thẻ Căn cước / CCCD');
  document.getElementById('qrX').onclick=function(){qrStop();closeOrBack();};
  var ov=document.getElementById('qrOv');ov.onclick=null;
}
start();
</script>
